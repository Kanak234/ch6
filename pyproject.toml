[project]
name = "saans-saathi"
version = "1.0.0"
description = "GenAI urban air-quality assistant: low-exposure routines, indoor air tips, greener choices and the measured impact of each"
authors = [{ name = "Kanak Prabhakar", email = "kanakprabhakar72@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "C4", "RET", "PL"]
# PLR2004: small literal thresholds are documented inline; PLC0415: lazy imports are deliberate (fast start-up)
ignore = ["PLR2004", "PLR0913", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "S105", "S106"]
"saans/i18n.py" = ["E501", "RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
